name: CI & Build Chrome Extension

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run unit tests (±7,000 km rule, conditional language, OCR & exporters)
        run: npm test

      - name: Build Manifest V3 Chrome Extension
        run: npm run build

      - name: Upload ready-to-load Chrome Extension folder
        uses: actions/upload-artifact@v4
        with:
          name: scarner-chrome-extension
          path: dist/
