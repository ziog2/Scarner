<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Scarner</title>
  <style>
    body {
      margin: 0;
      width: 330px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      font-size: 13px;
    }
    .header {
      background: #0f172a;
      color: #fff;
      padding: 13px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 14.5px;
    }
    .logo {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: #1d4ed8;
      display: grid;
      place-items: center;
      font-family: monospace;
      font-size: 11px;
    }
    .wrap {
      padding: 14px 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .stat {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 9px;
      padding: 9px 10px;
    }
    .stat-num {
      font-size: 17px;
      font-weight: 800;
      font-family: monospace;
    }
    .stat-lbl {
      font-size: 11px;
      color: #64748b;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 9px;
      padding: 9px 11px;
      font-size: 12px;
      font-weight: 600;
    }
    .btn {
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #0f172a;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }
    .btn.primary {
      background: #1d4ed8;
      border-color: #1d4ed8;
      color: #fff;
    }
    .status-msg {
      font-size: 11px;
      color: #475569;
      min-height: 15px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand"><span class="logo">SC</span><span>Scarner</span></div>
    <span style="font-size:11px;color:#93c5fd;font-weight:600;">AutoScout24 Active</span>
  </div>

  <div class="wrap">
    <div style="font-size:12px;color:#475569;">
      Open any vehicle listing on <strong>AutoScout24</strong> to verify specs, detect plates via OCR, and export PDF/CSV reports.
    </div>

    <div class="grid">
      <div class="stat">
        <div id="st-analyzed" class="stat-num">0</div>
        <div class="stat-lbl">Listings Checked</div>
      </div>
      <div class="stat">
        <div id="st-ocr" class="stat-num">0</div>
        <div class="stat-lbl">OCR Plates Found</div>
      </div>
      <div class="stat">
        <div id="st-exports" class="stat-num">0</div>
        <div class="stat-lbl">PDF / CSV Exports</div>
      </div>
      <div class="stat">
        <div id="st-pending" class="stat-num">0</div>
        <div class="stat-lbl">Queued for GitHub</div>
      </div>
    </div>

    <label class="row">
      <span>Auto-scan gallery photos (OCR)</span>
      <input id="chk-ocr" type="checkbox" />
    </label>

    <label class="row">
      <span>Anonymous usage telemetry</span>
      <input id="chk-telemetry" type="checkbox" />
    </label>

    <button id="btn-sync" class="btn primary" type="button">Sync Usage Stats to GitHub</button>
    <button id="btn-options" class="btn" type="button">Configure Free APIs &amp; GitHub Sync</button>
    <div id="sync-msg" class="status-msg"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
